name: Check Strong Workouts Data

on:
  workflow_dispatch:
    inputs:
      data_path:
        description: "Path to check for new strong_workouts.csv files"
        required: false
        default: "./projects/fitness-ingestion/src/assets/private"
        type: string
  workflow_call:
    inputs:
      data_path:
        description: "Path to check for new strong_workouts.csv files"
        required: false
        default: "./projects/fitness-ingestion/src/assets/private"
        type: string

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Install dependencies
        run: pnpm install

      - name: Check for new strong workouts data
        env:
          STRONG_DATA_PATH: ${{ inputs.data_path }}
        run: |
          cd projects/fitness-ingestion
          pnpm check:strong-data "${{ inputs.data_path }}"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add projects/fitness-ingestion/src/assets/private/strong_workouts.csv
          git commit -m "chore: merge new strong workouts data"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.has_changes == 'false'
        run: echo "No new data to merge"
